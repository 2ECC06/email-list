<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email list</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="javascript/index.js" type="module"></script>
</head>

<body>
    <!-- Add new user section -->
    <section>
        <h2>Add new user</h2>
        <form>
            <label>
                Name
                <input type="text" name="name" id="name-input" />
            </label>

            <label>
                Email
                <input type="text" name="email" id="email-input" />
            </label>

            <button id="add-user-btn" type="submit">Add user</button>
        </form>
    </section>

    <!-- User list section -->
    <section id="user-list" class="display-none">
        <div>
            <h2>User List</h2>
            <div><span>2</span>users</div>
        </div>

        <div class="info">
            <article>
                <div>
                    <p>Harry</p>
                    <p>harry@gmail.com</p>
                </div>

                <div>
                    <button type="button">Edit</button>
                    <button type="button">Delete</button>
                </div>
            </article>
        </div>
    </section>
</body>

</html>
