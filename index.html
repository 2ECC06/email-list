<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email list</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="icons/favicon.ico" />
    <script defer src="javascript/index.js" type="module"></script>
</head>

<body>
    <dialog id="update-modal">
        <form id="update-form">
            <div class="label-and-input">
                <label for="modal-name-input"> Name </label>
                <input type="text" id="modal-name-input" />
            </div>

            <div class="label-and-input">
                <label for="modal-email-input"> Email </label>
                <input type="email" id="modal-email-input" />
            </div>

            <div id="update-modal-buttons">
                <button id="update-user-btn" type="submit">Save</button>
                <button id="close-btn" type="button">Close</button>
            </div>
        </form>
    </dialog>

    <div id="main-cont">
        <!-- Add new user section -->
        <section id="new-user-section">
            <form id="add-user-form">
                <div class="label-and-input">
                    <label for="name-input"> Name </label>
                    <input type="text" id="name-input" />
                </div>

                <div class="label-and-input">
                    <label for="email-input"> Email </label>
                    <input type="email" id="email-input" />
                </div>

                <button id="add-user-btn" type="submit">Add user</button>
            </form>
        </section>

        <!-- User list section -->
        <section id="user-list-section">
            <header>
                <div>
                    <h2>User List</h2>
                    <div id="count-cont">
                        <span id="user-count">0</span>
                        <span id="user-count-text">users</span>
                    </div>
                </div>
                <button id="delete-all-btn">
                    <img src="./icons/trash-icon.svg" alt="trash icon" />
                </button>
            </header>

            <ul id="user-list" class="display-none">
                <li class="list-item">
                    <article class="cont">
                        <div class="user-info">
                            <p class="name">Ethan</p>
                            <p class="email">ethanobott6002@gmail.com</p>
                        </div>

                        <div id="edit-and-delete">
                            <button type="button" class="edit-btn">
                                Edit
                            </button>
                            <button type="button" class="delete-btn">
                                Delete
                            </button>
                        </div>
                    </article>
                </li>
            </ul>
        </section>
    </div>
</body>

</html>
