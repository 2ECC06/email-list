<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email list</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- <script defer src="javascript/index.js" type="module"></script> -->
</head>

<body>
    <dialog id="update-modal">
        <form id="update-form">
            <label>
                Name
                <input type="text" name="name" id="modal-name-input" />
            </label>

            <label>
                Email
                <input type="email" name="email" id="modal-email-input" />
            </label>

            <button id="update-user-btn" type="submit">Save</button>
            <button id="close-btn" type="button">Close</button>
        </form>
    </dialog>

    <div id="main-cont">
        <!-- Add new user section -->
        <section id="new-user-section">
            <h2>Add new user</h2>
            <form id="add-user-form">
                <div class="label-and-input">
                    <label for="name-input" class="new-user-label">
                        Name
                    </label>
                    <input type="text" id="name-input" />
                </div>

                <div class="label-and-input">
                    <label for="email-input" class="new-user-label">
                        Email
                    </label>
                    <input type="email" id="email-input" />
                </div>

                <button id="add-user-btn" type="submit">Add user</button>
            </form>
        </section>

        <!-- User list section -->
        <section id="user-list-section">
            <div>
                <h2>User List</h2>
                <div>
                    <span id="user-count">0</span>
                    <span id="user-count-text">Users</span>
                </div>
            </div>

            <ul id="user-list" class="display-none">
                <li>
                    <article>
                        <div>
                            <p class="name"></p>
                            <p class="email"></p>
                        </div>

                        <div>
                            <button type="button" class="edit-btn">
                                Edit
                            </button>
                            <button type="button" class="delete-btn">
                                Delete
                            </button>
                        </div>
                    </article>
                </li>
            </ul>
        </section>
    </div>
</body>

</html>
